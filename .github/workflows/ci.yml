name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      # A VS Code baixada pelo `vscode-test` é ~1 GB e some a cada execução. Guardá-la evita ir à
      # rede — que é exatamente onde o build já caiu, com ETIMEDOUT antes de a suíte começar.
      - name: Cache the VS Code build used by the tests
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
          restore-keys: vscode-test-${{ runner.os }}-

      # A suíte de integração sobe uma VS Code de verdade: precisa de display virtual no Linux.
      #
      # A repetição cobre só a falha de rede: se a suíte chegar a rodar e reprovar, o `npm test`
      # devolve o código de saída dos testes e o passo falha na primeira tentativa. O laço só existe
      # para o download que expira antes disso, e cada nova tentativa aparece no log.
      - name: Integration tests
        run: |
          for attempt in 1 2 3; do
            if xvfb-run -a npm test; then
              exit 0
            fi
            if ls -d .vscode-test/vscode-* >/dev/null 2>&1; then
              echo "::error::the suite ran and failed — not retrying"
              exit 1
            fi
            echo "::warning::attempt $attempt failed before the suite started (download); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::the VS Code download failed three times"
          exit 1

      - name: Build VSIX
        run: npx --yes @vscode/vsce package --out ai-commit-messages.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-commit-messages-vsix
          path: ai-commit-messages.vsix
          if-no-files-found: error

  release:
    name: Semantic Release
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish VSIX
    needs: [release]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Preparado para `vsce publish --oidc`, que publica sem PAT guardado: o portal da Marketplace
      # ainda não oferece a política de trusted publishing para este publisher. Quando oferecer,
      # basta trocar o passo abaixo por `npx --yes @vscode/vsce publish --oidc --packagePath ...`
      # e remover o segredo. PATs globais do Azure DevOps se aposentam em 01/12/2026.
      id-token: write
    env:
      # Lidos no `if` de cada passo: sem o segredo, o passo é pulado em vez de quebrar o pipeline.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set version
        run: npm version ${{ needs.release.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npx --yes @vscode/vsce package --out ai-commit-messages-${{ needs.release.outputs.version }}.vsix

      - name: Attach VSIX to the release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: ai-commit-messages-${{ needs.release.outputs.version }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--packagePath` publishes the file that was just attached to the release, so what people
      # download from GitHub and what the registries serve are the same bytes.
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: >-
          npx --yes @vscode/vsce publish
          --packagePath ai-commit-messages-${{ needs.release.outputs.version }}.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: >-
          npx --yes ovsx publish
          --packagePath ai-commit-messages-${{ needs.release.outputs.version }}.vsix
          --skip-duplicate

      - name: Say what was skipped
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: |
          echo "::notice::VSIX built and attached to the release."
          [ -n "$VSCE_PAT" ] || echo "::notice::Marketplace publish skipped — VSCE_PAT is not set."
          [ -n "$OVSX_PAT" ] || echo "::notice::Open VSX publish skipped — OVSX_PAT is not set." 
